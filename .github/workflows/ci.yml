name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
        include:
          # engines.node floor (">=22.18")
          - os: ubuntu-latest
            node: 22.18.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The shipped files as committed: no install, no build.
      - run: node --test 'test/*.test.mjs'
      - name: Pack, install and run the npm package
        working-directory: packages/humans-md
        run: | # zizmor: ignore[adhoc-packages] installs the tarball this job just packed
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g "$RUNNER_TEMP"/humans-md-cli-*.tgz
          test "$(humans-md --version)" = "$(node -p 'require("./package.json").version')"
          humans-md check "$GITHUB_WORKSPACE/test/fixtures/home/.humans/HUMANS.md"

  source:
    name: source (build check, core tests, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # esbuild runs from its platform package; no install script is needed.
      - run: npm ci --ignore-scripts
      - run: npm run check:spec
      # Every derived file (bundles, runtime copies, portable skill, licenses, versions) matches core/ and the sources.
      - run: npm run build -- --check
      - run: npm run typecheck
      - run: npm run test:core

  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Pinned; bump deliberately (check `npm view @anthropic-ai/claude-code dist-tags`).
      CLAUDE_CODE_VERSION: 2.1.292
      DISABLE_AUTOUPDATER: 1
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install Claude Code (pinned)
        run: | # zizmor: ignore[adhoc-packages] pinned by CLAUDE_CODE_VERSION; bumped deliberately
          npm install -g --include=optional "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/humans-md

  skills:
    name: agent skills spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Reference validator of agentskills.io, pinned to a commit of agentskills/agentskills
      # (skills-ref 0.1.0) with its locked dependencies; bump deliberately. The PyPI "skills-ref"
      # is uploaded by someone else and installs another command, so it is not used.
      SKILLS_REF_COMMIT: f130f348f502d9804278a617f86929846896d2e9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install skills-ref (pinned)
        run: | # zizmor: ignore[adhoc-packages] pinned to a commit, dependencies pinned to its uv.lock
          python -m venv "$RUNNER_TEMP/skills-ref"
          "$RUNNER_TEMP/skills-ref/bin/pip" install --no-cache-dir click==8.3.1 strictyaml==1.7.3 python-dateutil==2.9.0.post0 six==1.17.0 \
            "skills-ref @ git+https://github.com/agentskills/agentskills@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
      - name: Validate every SKILL.md
        run: |
          for skill in skills/humans-md-compile plugins/humans-md/skills/compile; do
            "$RUNNER_TEMP/skills-ref/bin/skills-ref" validate "$skill"
          done

  zizmor:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  # Single stable check name for branch rulesets.
  ci-ok:
    if: always()
    needs: [smoke, source, plugin, skills, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
