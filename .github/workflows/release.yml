name: release

on:
  push:
    tags: ['cli-v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm supports staged trusted publishing (>= 11.15.0)
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)"
      - name: Tag must match package version
        working-directory: packages/humans-md
        env:
          TAG: ${{ github.ref_name }}
        run: test "${TAG#cli-v}" = "$(node -p 'require("./package.json").version')"
      - run: node --test
      - name: Stage publish (a maintainer approves with 2FA on npmjs.com)
        working-directory: packages/humans-md
        run: npm stage publish
