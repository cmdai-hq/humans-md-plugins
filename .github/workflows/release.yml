name: release

# On a tag v<version> (docs/RELEASING.md): verify, test, stage @humans-md/cli on npm with trusted
# publishing (OIDC, no token; provenance is attached), then create the GitHub release.
# A maintainer approves the staged version with 2FA on npmjs.com before it is public.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check npm supports staged trusted publishing (>= 11.15.0)
        run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)"
      - run: npm ci --ignore-scripts
      - name: The tag must equal every version field
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run gen
          node scripts/release.mjs --verify "${TAG#v}"
      - run: npm run build -- --check
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:public
      - name: Stage publish (a maintainer approves with 2FA on npmjs.com)
        working-directory: packages/humans-md
        run: npm stage publish

  github-release:
    needs: publish
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag --title "$TAG" --generate-notes \
            --notes "Plugins and skill: install or update from this repository (README). npm: @humans-md/cli@${version}, staged by this release's workflow; public once a maintainer approves it on npmjs.com (https://www.npmjs.com/package/@humans-md/cli/v/${version})."
